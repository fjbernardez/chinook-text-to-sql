name: Deploy dev

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}:develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy Kubernetes manifests to EC2
        run: |
          scp -i ~/.ssh/ec2_key.pem -r k8s ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/k8s

      - name: Deploy to k3s
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            kubectl apply -f /home/ec2-user/k8s/namespace.yaml

            kubectl -n chinook create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io \
              --docker-username='${{ github.actor }}' \
              --docker-password='${{ secrets.GITHUB_TOKEN }}' \
              --dry-run=client -o yaml | kubectl apply -f -

            kubectl -n chinook create secret generic chinook-db-secret \
              --from-literal=DB_HOST='${{ secrets.DB_HOST }}' \
              --from-literal=DB_PORT='${{ secrets.DB_PORT }}' \
              --from-literal=DB_NAME='${{ secrets.DB_NAME }}' \
              --from-literal=DB_USER='${{ secrets.DB_USER }}' \
              --from-literal=DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
              --dry-run=client -o yaml | kubectl apply -f -

            kubectl apply -f /home/ec2-user/k8s/deployment.yaml
            kubectl apply -f /home/ec2-user/k8s/service.yaml
            kubectl apply -f /home/ec2-user/k8s/ingress.yaml

            kubectl -n chinook rollout restart deployment/chinook-api
            kubectl -n chinook rollout status deployment/chinook-api --timeout=180s
          EOF