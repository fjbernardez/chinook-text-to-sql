name: Deploy dev

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}:develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to k3s through SSM
        id: ssm-deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy chinook-text-to-sql to k3s" \
            --parameters 'commands=[
              "set -e",
              "dnf install -y git || true",
              "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
              "mkdir -p /opt/chinook-text-to-sql",
              "if [ -d /opt/chinook-text-to-sql/.git ]; then cd /opt/chinook-text-to-sql && git fetch origin develop && git reset --hard origin/develop; else rm -rf /opt/chinook-text-to-sql && git clone --branch develop https://github.com/fjbernardez/chinook-text-to-sql.git /opt/chinook-text-to-sql; fi",
              "kubectl apply -f /opt/chinook-text-to-sql/k8s/namespace.yaml",
              "kubectl -n chinook create secret generic chinook-db-secret --from-literal=DB_HOST='\''${{ secrets.DB_HOST }}'\'' --from-literal=DB_PORT='\''${{ secrets.DB_PORT }}'\'' --from-literal=DB_NAME='\''${{ secrets.DB_NAME }}'\'' --from-literal=DB_USER='\''${{ secrets.DB_USER }}'\'' --from-literal=DB_PASSWORD='\''${{ secrets.DB_PASSWORD }}'\'' --dry-run=client -o yaml | kubectl apply -f -",
              "kubectl -n chinook create secret generic app-secrets --from-literal=OPENAI_API_KEY='\''${{ secrets.OPENAI_API_KEY }}'\'' --dry-run=client -o yaml | kubectl apply -f -",
              "kubectl apply -f /opt/chinook-text-to-sql/k8s/deployment.yaml",
              "kubectl apply -f /opt/chinook-text-to-sql/k8s/service.yaml",
              "kubectl apply -f /opt/chinook-text-to-sql/k8s/ingress.yaml",
              "kubectl -n chinook rollout restart deployment/chinook-api",
              "kubectl -n chinook rollout status deployment/chinook-api --timeout=180s"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM command result
        run: |
          COMMAND_ID="${{ steps.ssm-deploy.outputs.command_id }}"
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text || true)

            echo "SSM status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "SSM command failed"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text || true

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text || true
              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting for SSM command"
          exit 1
